name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: site
      - name: Apply SPA basepath patch
        working-directory: site
        run: python ../publish/quartz-patches/apply.py .
      - name: Apply publish overlay
        run: cp publish/quartz.config.yaml site/quartz.config.yaml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: site/.quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        working-directory: site
        run: npm ci
      - name: Install Quartz plugins
        working-directory: site
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        working-directory: site
        run: npx quartz build -d ..
      - name: Patch sidebar title link
        working-directory: site
        run: python ../publish/quartz-patches/patch-title-link.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
